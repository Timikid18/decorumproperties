; Decorum PHP override loaded via PHP_INI_SCAN_DIR (no admin php.ini edit needed)
; Root cause: php.ini sets upload_tmp_dir=C:\Users\xampp\tmp which is NOT writable by the
; current user, so PHP falls back to the system temp and emits a "PHP Request Startup"
; Notice on every file upload that corrupts the JSON response. Fix here:
upload_tmp_dir = "C:\Users\ah\AppData\Local\Temp"
sys_temp_dir = "C:\Users\ah\AppData\Local\Temp"
; Safety net: never let request-startup notices leak into JSON bodies.
display_errors = Off
error_reporting = -1
; log_errors stays On (writes to php error log) so real errors aren't hidden.
